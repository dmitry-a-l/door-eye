# Отключаем HSP/HFP (гарнитурные профили) у Bluetooth-устройств.
#
# Колонка VIBRO-26W при коннекте сначала пыталась поднять HFP (UUID 111e),
# которого в системе нет (нет ofono/ModemManager). BlueZ ждал отвала HFP
# по таймауту, из-за чего connect занимал несколько минут и сыпал
# br-connection-profile-unavailable, а в логе wireplumber появлялись
# "RFCOMM receive command but modem not available: AT+...".
#
# Пустой headset-roles => WirePlumber вообще не регистрирует HFP/HSP в BlueZ,
# колонке остаётся только A2DP, и коннект проходит за пару секунд.

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.headset-roles = [ ]
  bluez5.enable-hw-volume = true
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = false
}
