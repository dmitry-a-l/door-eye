# Disable HSP/HFP (headset profiles) on Bluetooth devices.
#
# On connect the VIBRO-26W first tried to bring up HFP (UUID 111e), which the
# system has no backend for (no ofono/ModemManager). BlueZ waited for HFP to time
# out, so connect took several minutes and spat br-connection-profile-unavailable,
# and wireplumber logged "RFCOMM receive command but modem not available: AT+...".
#
# Empty headset-roles => WirePlumber never registers HFP/HSP with BlueZ, the
# speaker is left with A2DP only, and connect completes in a couple of seconds.
#
# enable-hw-volume is off on purpose: with hardware (AVRCP) volume the speaker
# reported a fixed level (~0.40) that wpctl could not override, so the autoconnect
# script could not force BT_VOLUME. With it off, PipeWire applies a software
# volume that is always settable, letting the script pin the level after every
# reconnect.

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.headset-roles = [ ]
  bluez5.enable-hw-volume = false
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = false
}
